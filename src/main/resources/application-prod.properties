# 공통
logging.level.com.nyangmeong=info

# Swagger(OpenAPI) 끄기. 운영에서 API 문서를 공개하지 않는다
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# 파일 저장 루트(폴더와 쓰기 권한이 없으면 앱이 시작되지 않는다)
app.file.root-dir=/home/ggorilab/attachment

# 로그 파일 폴더(logback-spring.xml). 생략하면 실행 폴더 아래 logs
app.log.dir=/home/ggorilab/logs

# 케어미션 정산·출제 배치(SCR-MYP-020). 운영 서버에서만 켠다. 서버가 2대 이상이면 한 대만 켠다
app.care-mission.batch-enabled=true
